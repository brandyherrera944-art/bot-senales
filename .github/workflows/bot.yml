name: Bot de señales

on:
  schedule:
    - cron: "0 */6 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bot-senales
  cancel-in-progress: false

jobs:
  correr:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Ejecutar bot
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MIN_WINRATE: "73"
          EXPIRACION_VELAS: "3"
          DURACION_MINUTOS: "345"
        run: python bot.py
      - name: Guardar resultados y mantener el bot activo
        if: always()
        run: |
          date -u > ultima_ejecucion.txt
          git config user.name "bot-senales"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ultima_ejecucion.txt
          if [ -f resultados.csv ]; then git add resultados.csv; fi
          if [ -f vigilancia.csv ]; then git add vigilancia.csv; fi
          git commit -m "Resultados $(date -u +%F_%H:%M)" || echo "sin cambios"
          git pull --rebase || true
          git push
