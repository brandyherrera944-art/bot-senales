name: Probar SMC EURUSD Nueva York (2 anos)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  investigar:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: pip install -r requirements.txt
      - name: Descargar 2 anos de EURUSD 5 min (Dukascopy)
        run: |
          mkdir -p datos
          python descargar_dukascopy.py 2024-10-01 $(date -u -d yesterday +%F)
          ls -la datos
          head -3 datos/*.csv
      - name: Probar estrategia SMC en Nueva York
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python investigar_smc_ny.py
      - name: Guardar resultados
        if: always()
        run: |
          git config user.name "bot-senales"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -f operaciones_smc_ny.csv ]; then git add operaciones_smc_ny.csv; fi
          git commit -m "Investigacion SMC NY $(date -u +%F_%H:%M)" || echo "sin cambios"
          git pull --rebase || true
          git push
