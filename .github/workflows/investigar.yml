name: Probar estrategias

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  investigar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Probar estrategias
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python investigar.py
      - name: Guardar resultados
        if: always()
        run: |
          git config user.name "bot-senales"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -f investigacion.csv ]; then git add investigacion.csv; fi
          git commit -m "Investigacion $(date -u +%F_%H:%M)" || echo "sin cambios"
          git pull --rebase || true
          git push
